<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio of Hanif Muthiar Tsani — Full Stack Developer based in Bandung, Indonesia." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <title>Hanif Muthiar Tsani — Portfolio</title>
    <script>
      // Apply saved theme before React render to avoid flash (light is default)
      try {
        var savedTheme = window.localStorage.getItem('portfolio-theme');
        var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-layout', 'emerald');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-layout', 'emerald');
      }
    </script>
    <script>
      // Apply saved accent before React render
      try {
        var saved = window.localStorage.getItem('portfolio-accent');
        var valid = ['default', 'ocean', 'emerald', 'violet', 'orange', 'rose'];
        if (valid.indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-accent', saved);
        } else {
          document.documentElement.setAttribute('data-accent', 'default');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-accent', 'default');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
